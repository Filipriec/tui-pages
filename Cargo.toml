[package]
name = "tui-pages"
version = "0.7.2"
edition = "2021"
license = "MIT"
description = "Core for TUI apps with multiple pages"
repository = "https://gitlab.com/filipriec/tui-pages"
readme = "README.md"
keywords = ["tui", "terminal", "ratatui", "keyboard", "ui"]
categories = ["command-line-interface"]
exclude = ["examples/", ".claude/", ".forge/"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.28", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tracing = "0.1"

[features]
default = []
# Derives serde on the input/mode types. KeyChord embeds crossterm's KeyCode /
# KeyModifiers, so we also turn on crossterm's own serde impls.
serde = ["dep:serde", "crossterm/serde"]
# Built-in modal dialog: content/result types plus a ratatui renderer.
# Pulls in ratatui; the rest of the crate stays rendering-agnostic.
dialog = ["dep:ratatui"]

[workspace]
